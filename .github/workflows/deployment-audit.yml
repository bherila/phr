name: Deployment Request Audit

on:
  workflow_run:
    workflows: [CI, OHIF Dist]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  record:
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted main scripts only; never check out the terminal request's source.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Record terminal request and current desired sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/deployment-policy.mjs audit
      - uses: actions/upload-artifact@v7
        with:
          name: deployment-request-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: deployment-request.json
          retention-days: 90
