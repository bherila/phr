name: PHR Production Key Bootstrap

on:
  pull_request:
    paths:
      - .github/scripts/install-phr-production-key*.sh
      - .github/scripts/verify-phr-production-key-pair.sh
      - tests/Unit/ProductionKeyBootstrapWorkflowTest.php
      - .github/workflows/production-key-bootstrap.yml
  workflow_dispatch:
    inputs:
      public_key:
        description: Dedicated OpenSSH ed25519 public key matching PHR_PRODUCTION_SSH_KEY
        required: true
        type: string
      expected_release:
        description: Exact selected incident release; refuse another release
        required: true
        default: 7b33fe7445aa-37239370303-1
        type: string
      expected_commit:
        description: Exact selected incident source commit; refuse another commit
        required: true
        default: 7b33fe7445aa6d0a002f2e752497282b04c360a2
        type: string

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate synthetic SSH authorization fixtures
        run: |
          shellcheck .github/scripts/install-phr-production-key*.sh .github/scripts/verify-phr-production-key-pair.sh
          bash .github/scripts/install-phr-production-key.test.sh

  authorize:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    concurrency:
      group: phr-production-files
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out reviewed shared helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bherila/shared-cpanel-deployment
          ref: 395b0d8b10db1181e50f4eec27d7bce27b1522d6 # reviewed merged shared #41
          path: .shared-cpanel-deployment
          persist-credentials: false
      - name: Validate both credential scopes, key pair and incident identity before SSH
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
          BOOTSTRAP_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          POLICY_PRIVATE_KEY: ${{ secrets.PHR_PRODUCTION_SSH_KEY }}
          EXPECTED_RELEASE: ${{ inputs.expected_release }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test -n "$BOOTSTRAP_PRIVATE_KEY" && test -n "$POLICY_PRIVATE_KEY"
          test "$EXPECTED_RELEASE" = 7b33fe7445aa-37239370303-1
          test "$EXPECTED_COMMIT" = 7b33fe7445aa6d0a002f2e752497282b04c360a2
          bash .github/scripts/verify-phr-production-key-pair.sh
      - name: Configure legacy credential only for SSH authorization bootstrap
        env:
          SSH_ALIAS: phr-key-bootstrap
          SSH_HOST_NAME: ${{ secrets.SSH_HOST }}
          SSH_USER_NAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash .shared-cpanel-deployment/scripts/configure-ssh.sh
      - name: Authorize the restricted public key on the exact idle release
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
          EXPECTED_RELEASE: ${{ inputs.expected_release }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          if ! (ulimit -f 1024; timeout --kill-after=5s 60s ssh -o BatchMode=yes -o ConnectTimeout=10 phr-key-bootstrap \
            "bash -s -- $(printf '%q ' /opt/cpanel/ea-php85/root/usr/bin/php "$EXPECTED_RELEASE" "$EXPECTED_COMMIT" "$PUBLIC_KEY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")" \
            < .github/scripts/install-phr-production-key.sh > "$scratch/proof" 2> "$scratch/error"); then
            echo 'Production key authorization failed; details redacted.' >&2
            exit 1
          fi
          LC_ALL=C awk 'NR != 1 || $0 !~ /^phr-production-key identity=exact restricted=yes authorized=(installed|unchanged)$/ { invalid=1 }
            END { if (NR != 1 || invalid) exit 1; print "PHR restricted key authorization confirmed." }' "$scratch/proof"
      - name: Configure the dedicated credential without legacy fallback
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
          SSH_ALIAS: phr-policy-verify
          SSH_HOST_NAME: ${{ secrets.SSH_HOST }}
          SSH_USER_NAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.PHR_PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bash .shared-cpanel-deployment/scripts/configure-ssh.sh
          # %C normally shares a connection between aliases for the same host/user.
          # First-value SSH settings force fresh authentication using this key alone.
          umask 077
          temporary=$(mktemp "$HOME/.ssh/.policy-config.XXXXXX")
          printf 'Host phr-policy-verify\n    ControlMaster no\n    ControlPath none\n    IdentityAgent none\n' > "$temporary"
          cat "$HOME/.ssh/config" >> "$temporary"
          mv "$temporary" "$HOME/.ssh/config"
      - name: Prove the dedicated credential with read-only exact diagnostics
        env:
          DIAG_SSH_TARGET: phr-policy-verify
          DIAG_PHP_BINARY: /opt/cpanel/ea-php85/root/usr/bin/php
          DIAG_EXPECTED_RELEASE: ${{ inputs.expected_release }}
          DIAG_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PHR_SHARED_ACTION_DIR: ${{ github.workspace }}/.shared-cpanel-deployment
        run: bash .github/scripts/diagnose-phr-maintenance.sh
