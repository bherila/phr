name: PHR Maintenance Diagnostic

on:
  pull_request:
    paths:
      - .github/scripts/diagnose-phr-maintenance*.sh
      - .github/scripts/inspect-phr-maintenance.sh
      - .github/workflows/maintenance-diagnostic.yml
  workflow_dispatch:
    inputs:
      expected_release:
        description: Exact selected release to inspect; refuse a different live release
        required: true
        type: string
      expected_commit:
        description: Exact selected source commit (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the reviewed shared helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bherila/shared-cpanel-deployment
          ref: cf50667c99feff7ac8d785e07b3abca9f0f99513 # reviewed merged runtime audit and bounded finalizer hooks
          path: .shared-cpanel-deployment
          persist-credentials: false
      - name: Shell and synthetic read-only diagnostics
        env:
          PHR_SHARED_ACTION_DIR: ${{ github.workspace }}/.shared-cpanel-deployment
        run: |
          shellcheck .github/scripts/diagnose-phr-maintenance*.sh .github/scripts/inspect-phr-maintenance.sh
          bash .github/scripts/diagnose-phr-maintenance.test.sh

  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    concurrency:
      # Both app and OHIF writers use this group; retain pending jobs.
      group: phr-production-files
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the reviewed shared helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bherila/shared-cpanel-deployment
          ref: cf50667c99feff7ac8d785e07b3abca9f0f99513 # reviewed merged runtime audit and bounded finalizer hooks
          path: .shared-cpanel-deployment
          persist-credentials: false
      - name: Configure the diagnostic SSH identity
        env:
          SSH_ALIAS: phr-diagnostic
          SSH_HOST_NAME: ${{ secrets.SSH_HOST }}
          SSH_USER_NAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.PHR_PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash .shared-cpanel-deployment/scripts/configure-ssh.sh
      - name: Inspect the exact selected PHR release without resuming it
        env:
          DIAG_SSH_TARGET: phr-diagnostic
          DIAG_PHP_BINARY: /opt/cpanel/ea-php85/root/usr/bin/php
          DIAG_EXPECTED_RELEASE: ${{ inputs.expected_release }}
          DIAG_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PHR_SHARED_ACTION_DIR: ${{ github.workspace }}/.shared-cpanel-deployment
        run: bash .github/scripts/diagnose-phr-maintenance.sh
