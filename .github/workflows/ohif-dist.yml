name: OHIF Dist

# Build the static OHIF Viewer bundle and deploy it to public/ohif/ on the
# server. Independent of the main CI deploy so OHIF upgrades don't piggyback
# on every app deploy — and so we don't have to commit ~200 MB of OHIF build
# artifacts to this repo.
#
# The main CI rsync (ci.yml) excludes the `ohif` directory so app deploys
# don't clobber the OHIF dist that lives at ~/phr-laravel/public/ohif/ on the
# server.
#
# Issue #126: this is no longer the only thing that writes there. Both this
# job and CI's deploy job now publish through .github/scripts/converge-ohif-dist.sh
# against a shared digest record, so publishing is idempotent and either writer
# can repair the other. That is what makes an evicted deploy here recoverable:
# GitHub keeps one pending job per concurrency group, so an arriving
# application deploy can evict this one, and before the shared convergence step
# the bundle it was carrying was then lost permanently.
#
# Deploys to ~/phr-laravel/public/ohif/ using this repo's key-based deploy
# credentials (see ci.yml's `deploy` job for the same pattern).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'OHIF Viewers release tag (e.g. v3.12.0)'
        required: true
        default: 'v3.12.0'
  # Re-run automatically if the patcher script or workflow itself changes,
  # since both affect what the deployed bundle looks like.
  push:
    branches: [main]
    paths:
      - '.github/ohif/**'
      - '.github/workflows/ohif-dist.yml'

concurrency:
  group: ohif-dist
  cancel-in-progress: false
  # Retain pending builds rather than cancelling and replacing them; see the
  # deploy job below and issue #126. This workflow runs only on dispatch and on
  # pushes to main, so there is no pull-request supersede behaviour to preserve.
  queue: max

permissions:
  contents: read

jobs:
  build:
    name: Build OHIF Dist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # When triggered by push, no input is available; fall back to a pinned tag.
      OHIF_TAG: ${{ github.event.inputs.tag || 'v3.12.0' }}

    steps:
      - name: Checkout phr (for patcher script)
        uses: actions/checkout@v7
        with:
          path: phr
          sparse-checkout: |
            .github/ohif
          sparse-checkout-cone-mode: false

      - name: Checkout OHIF Viewers ${{ env.OHIF_TAG }}
        uses: actions/checkout@v7
        with:
          repository: OHIF/Viewers
          ref: ${{ env.OHIF_TAG }}
          path: Viewers

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: Viewers/yarn.lock

      - name: Patch OHIF config for /ohif/ subpath + dicomjson default
        run: node phr/.github/ohif/patch-config.mjs Viewers

      - name: Yarn install
        working-directory: Viewers
        run: yarn install --frozen-lockfile

      - name: Yarn build (PUBLIC_URL=/ohif/)
        working-directory: Viewers
        env:
          PUBLIC_URL: /ohif/
        run: yarn run build

      # Deploy only needs this job, so a bundle that fails here never reaches
      # public/ohif/. Checks every file index.html references and the two
      # settings patch-config.mjs applies; see the script's header.
      - name: Verify build output
        run: |
          bash phr/.github/ohif/verify-dist.sh Viewers/platform/app/dist
          du -sh Viewers/platform/app/dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ohif-dist
          path: Viewers/platform/app/dist

  deploy:
    name: Deploy OHIF Dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment: prod
    concurrency:
      # The Laravel deploy moves/selects the same persistent public/ohif tree.
      group: phr-production-files
      cancel-in-progress: false
      # Matches CI's deploy job: retain pending production writers instead of
      # replacing them. Bounded at 100 pending, and not an ordering guarantee.
      queue: max
    permissions:
      contents: read
    steps:
      - name: Checkout phr (for the convergence script)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ohif-dist
          path: ohif-dist

      # Same scoped alias pattern as ci.yml's deploy job and as the shared
      # cPanel action: a dedicated key and known_hosts file, appended rather
      # than overwriting whatever else the runner holds. Host key pinned; no
      # StrictHostKeyChecking=no.
      - name: Configure SSH for OHIF convergence
        env:
          SSH_ALIAS: phr-ohif
          SSH_HOST_NAME: ${{ secrets.SSH_HOST }}
          SSH_USER_NAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash .github/scripts/configure-ohif-ssh.sh

      # Publishes only when the live bundle differs, and records what it
      # published so CI's deploy job can tell whether it still has work to do.
      # --delete stays scoped to public/ohif; see the script's header.
      - name: Converge the deployed OHIF bundle
        env:
          OHIF_SSH_TARGET: phr-ohif
          OHIF_DEPLOY_DIR: phr-laravel
          OHIF_BUNDLE_DIR: ohif-dist
        run: bash .github/scripts/converge-ohif-dist.sh

      - name: Summarize
        env:
          OHIF_TAG: ${{ github.event.inputs.tag || 'v3.12.0' }}
        run: |
          echo "Deployed OHIF ${OHIF_TAG} to /ohif/ on ${{ secrets.SSH_HOST }}." >> "$GITHUB_STEP_SUMMARY"
