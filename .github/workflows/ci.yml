name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A green push to main deploys automatically; this also permits manual redeploys.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A main run may already be quiescing production. Never cancel it between the
  # durable remote phases; pull-request runs can still supersede one another.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Build frontend
        run: pnpm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: public/build/
          retention-days: 2

  frontend-static:
    name: Frontend Static Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      # This repository is public and the application handles clinical records, so a
      # committed identifier cannot be walked back: deleting it later leaves it in
      # history and in every fork. The scanner redacts its own output because CI logs
      # for a public repository are public too.
      - name: Scan for sensitive data
        run: pnpm run scan-sensitive

      - name: Audit Node dependencies
        run: pnpm audit --audit-level high --ignore-registry-errors

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Run Jest
        run: pnpm run test

  backend-static:
    name: Backend Static Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Test atomic deployment hooks
        run: |
          bash .github/scripts/quiesce-phr-deployment.test.sh
          bash .github/scripts/provision-phr-candidate-secrets.test.sh
          bash .github/scripts/verify-phr-candidate.test.sh
          bash .github/scripts/verify-phr-activation.test.sh
          bash .github/scripts/verify-phr-deployment.test.sh
          bash .github/scripts/verify-phr-ohif-artifact.test.sh
          bash .github/scripts/converge-ohif-dist.test.sh
          bash .github/ohif/verify-dist.test.sh

      - name: Test agent mutation digest key installer
        run: bash .github/scripts/configure-agent-mutation-digest-key.test.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Validate synthetic C-CDA document
        run: pnpm run validate:ccda

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Run Pint
        run: ./vendor/bin/pint --test

      # phpstan.neon and the larastan dev dependency exist so this can gate; a
      # config that CI never runs is not a gate.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  backend-tests:
    name: Backend Tests
    # Some page tests render a real Blade view without ->withoutVite(), so they need
    # an actual public/build/manifest.json — reuse frontend-build's artifact instead
    # of building twice.
    needs: frontend-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Create .env for tests
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run PHPUnit
        run: php -d memory_limit=1G vendor/bin/phpunit

  e2e:
    name: Playwright E2E
    needs: frontend-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Run Tests
    needs:
      - frontend-build
      - frontend-static
      - frontend-tests
      - backend-static
      - backend-tests
      - e2e
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check required job results
        run: |
          check() {
            local name="$1" result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name => $result"
              exit 1
            fi
            echo "$name => $result"
          }
          check "frontend-build" "${{ needs.frontend-build.result }}"
          check "frontend-static" "${{ needs.frontend-static.result }}"
          check "frontend-tests" "${{ needs.frontend-tests.result }}"
          check "backend-static" "${{ needs.backend-static.result }}"
          check "backend-tests" "${{ needs.backend-tests.result }}"
          check "e2e" "${{ needs.e2e.result }}"

  deploy:
    name: Deploy to Production
    needs:
      - test
      - frontend-build
    # Deploys automatically on a green push to main. `workflow_dispatch` also still
    # works for a manual redeploy.
    #
    # This was manual-only while the repo was private and unreviewed: an authorization
    # review was outstanding and `required_reviewers` is not available on private repos
    # without a paid plan, so there was no way to gate an automatic deploy. Both
    # conditions have since cleared — the review is done and its findings are fixed,
    # and the repo is public.
    #
    # The gate that remains is `needs.test.result == 'success'`: the aggregate job checks
    # every other job explicitly, so a new job added to this workflow must also be added
    # to that check or it becomes invisible to the gate and can fail while the deploy
    # still runs.
    if: ${{ !cancelled() && vars.ATOMIC_DEPLOY_ENABLED != 'false' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs['frontend-build'].result == 'success' }}
    runs-on: ubuntu-24.04-arm
    environment: prod
    concurrency:
      # The one writer to ~/phr-laravel, for both the application release and
      # the OHIF bundle. `cancel-in-progress: false` and the shared action's
      # remote lock still apply; see the OHIF convergence steps below for why
      # this job, rather than GitHub concurrency, is what keeps writes whole.
      group: phr-production-files
      cancel-in-progress: false
    permissions:
      contents: read
      # Resolving and downloading the OHIF Dist bundle from its own run.
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer (no dev)
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Deploy with the shared cPanel action
        uses: bherila/shared-cpanel-deployment@6e9edf640e38b828eb0b273c339474b28ab3dca4 # v2.1.2
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-dir: phr-laravel
          site-url: https://phr.bherila.net
          atomic-layout: stable-directory
          initial-live-commit: ${{ vars.ATOMIC_INITIAL_LIVE_COMMIT }}
          recovery-release-id: ${{ vars.ATOMIC_RECOVERY_RELEASE_ID }}
          failure-policy: maintenance
          operational-audit: true
          # The pre-migrate hook runs the digest-key installer from the candidate.
          # Keep the shared action's standard application paths plus that helper.
          paths: |
            app
            bootstrap
            config
            database
            public
            resources
            routes
            scripts
            storage
            vendor
            artisan
            composer.json
            composer.lock
          persistent-paths: |
            storage
            public/ohif
          excludes: |
            ohif
            phr-documents
            phr-exports
            phr-dicom
            s3-blobs
            /storage/app/private/oauth/
          passport-key-directory: storage/app/private/oauth
          artisan-memory-limit: 1G
          artisan-commands: phr:agent-api:verify-oauth-keys
          quiesce-script: .github/scripts/quiesce-phr-deployment.sh
          pre-migrate-script: .github/scripts/provision-phr-candidate-secrets.sh
          post-deploy-script: .github/scripts/verify-phr-candidate.sh
          post-activate-script: .github/scripts/verify-phr-activation.sh
          install-cron: true
          cron-memory-limit: 1G
          cron-lines: |
            */5 * * * * cd "$HOME/phr-laravel" && PHR_CRON_MEMORY_LIMIT=1G /opt/cpanel/ea-php85/root/usr/bin/php artisan phr:uptime:run-scheduler >> /dev/null 2>&1 # JOB:phr-laravel-scheduler
          extra-cron-lines: |
            */5 * * * * cd "$HOME/phr-laravel" && PHR_CRON_MEMORY_LIMIT=1G /usr/bin/flock -n "$HOME/phr-laravel/storage/framework/phr-queue-worker.lock" /opt/cpanel/ea-php85/root/usr/bin/php artisan phr:uptime:run-worker >> /dev/null 2>&1 # JOB:phr-laravel-queue-worker
          verification-script: .github/scripts/verify-phr-deployment.sh

      # --- OHIF convergence (issue #126) -------------------------------------
      #
      # The OHIF bundle is published by its own workflow's deploy job, which
      # shares this job's `phr-production-files` concurrency group. GitHub keeps
      # only one pending job per group, so an application deploy arriving while
      # an OHIF deploy waits will evict it. That is harmless in the other
      # direction -- an application deploy always ships current `main`, so the
      # run that evicts one subsumes it -- but an OHIF deploy carried one
      # specific artifact that nothing else would ever publish, and the
      # application rsync excludes `ohif`. An evicted OHIF deploy was therefore
      # lost permanently and silently.
      #
      # Serializing on the remote lock instead is not available: the shared
      # action takes it with a single `mkdir`, no retry, and hard-fails asking
      # for manual recovery when it is held, so a losing writer breaks rather
      # than queues. The GitHub-level serializer has to stay.
      #
      # So this job converges OHIF too, through the same idempotent script and
      # the same digest record the OHIF workflow writes. Whichever writer runs
      # repairs the other, which bounds the loss to "until the next deploy"
      # instead of forever. Nothing is published when the digests already
      # agree, so an ordinary application deploy pays one ssh round trip.
      - name: Resolve the newest built OHIF bundle
        id: ohif
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Resolved from the artifact, not from the OHIF run's conclusion.
          # A run whose own deploy job was evicted ends `cancelled`, so keying
          # off run status would permanently hide exactly the bundle this is
          # here to repair. The artifact exists as soon as the build job
          # uploaded it, which is the moment the bundle becomes publishable.
          # The API returns artifacts newest first; `expired` covers both the
          # retention window and a manual delete.
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ohif-dist&per_page=20" \
            --jq '[.artifacts[]
                   | select(.expired == false)
                   | select(.workflow_run.head_branch == "main")][0].workflow_run.id // empty')"
          if [[ -n "$run_id" ]]; then
            echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          else
            # Nothing to converge to is not a deployment failure. The live
            # bundle is left exactly as it is.
            echo 'No usable OHIF bundle to converge to; leaving the live one alone.'
            echo "run_id=" >>"$GITHUB_OUTPUT"
          fi

      - name: Download the newest OHIF bundle
        if: ${{ steps.ohif.outputs.run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ohif-dist
          path: ohif-desired
          run-id: ${{ steps.ohif.outputs.run_id }}
          github-token: ${{ github.token }}

      # The shared action manages its own SSH for the application release and
      # leaves nothing behind for later steps, so convergence brings its own.
      # Host key pinned from SSH_KNOWN_HOSTS; no StrictHostKeyChecking=no.
      - name: Set up SSH for OHIF convergence
        if: ${{ steps.ohif.outputs.run_id != '' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Keeps transport flags out of the convergence script, so it stays
          # exercisable offline with a stubbed ssh in its own test harness.
          {
            printf 'Host %s\n' "$SSH_HOST"
            printf '  IdentityFile ~/.ssh/id_ed25519\n'
            printf '  IdentitiesOnly yes\n'
          } >~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Converge the deployed OHIF bundle
        if: ${{ steps.ohif.outputs.run_id != '' }}
        env:
          OHIF_SSH_TARGET: ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}
          OHIF_DEPLOY_DIR: phr-laravel
          OHIF_BUNDLE_DIR: ohif-desired
        run: bash .github/scripts/converge-ohif-dist.sh
