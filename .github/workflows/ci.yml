name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A green push to main deploys automatically; this also permits manual redeploys.
  workflow_dispatch:
    inputs:
      operation:
        description: Leave empty for normal CI; diagnose-phr-orphan is read-only
        required: false
        type: string
      confirmation:
        description: Type DIAGNOSE_PHR_35100840905 for the fixed failed deployment
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A main run may already be quiescing production. Never cancel it between the
  # durable remote phases; pull-request runs can still supersede one another.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend-build:
    if: ${{ inputs.operation != 'diagnose-phr-orphan' && inputs.operation != 'recover-phr-orphan' }}
    name: Frontend Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Build frontend
        run: pnpm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: public/build/
          retention-days: 2

  frontend-static:
    if: ${{ inputs.operation != 'diagnose-phr-orphan' && inputs.operation != 'recover-phr-orphan' }}
    name: Frontend Static Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      # This repository is public and the application handles clinical records, so a
      # committed identifier cannot be walked back: deleting it later leaves it in
      # history and in every fork. The scanner redacts its own output because CI logs
      # for a public repository are public too.
      - name: Scan for sensitive data
        run: pnpm run scan-sensitive

      - name: Audit Node dependencies
        run: pnpm audit --audit-level high --ignore-registry-errors

  frontend-tests:
    if: ${{ inputs.operation != 'diagnose-phr-orphan' && inputs.operation != 'recover-phr-orphan' }}
    name: Frontend Tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Run Jest
        run: pnpm run test

  backend-static:
    if: ${{ inputs.operation != 'diagnose-phr-orphan' && inputs.operation != 'recover-phr-orphan' }}
    name: Backend Static Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Test atomic deployment hooks
        run: |
          bash .github/scripts/quiesce-phr-deployment.test.sh
          bash .github/scripts/provision-phr-candidate-secrets.test.sh
          bash .github/scripts/verify-phr-candidate.test.sh
          bash .github/scripts/verify-phr-activation.test.sh
          bash .github/scripts/verify-phr-deployment.test.sh
          bash .github/scripts/diagnose-phr-orphan.test.sh
          bash .github/scripts/recover-phr-orphan.test.sh
          bash .github/scripts/verify-phr-orphan-public.test.sh
          bash .github/scripts/verify-phr-ohif-artifact.test.sh

      - name: Test agent mutation digest key installer
        run: bash .github/scripts/configure-agent-mutation-digest-key.test.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Validate synthetic C-CDA document
        run: pnpm run validate:ccda

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Run Pint
        run: ./vendor/bin/pint --test

      # phpstan.neon and the larastan dev dependency exist so this can gate; a
      # config that CI never runs is not a gate.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  backend-tests:
    if: ${{ inputs.operation != 'diagnose-phr-orphan' && inputs.operation != 'recover-phr-orphan' }}
    name: Backend Tests
    # Some page tests render a real Blade view without ->withoutVite(), so they need
    # an actual public/build/manifest.json — reuse frontend-build's artifact instead
    # of building twice.
    needs: frontend-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Create .env for tests
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run PHPUnit
        run: php -d memory_limit=1G vendor/bin/phpunit

  e2e:
    if: ${{ inputs.operation != 'diagnose-phr-orphan' && inputs.operation != 'recover-phr-orphan' }}
    name: Playwright E2E
    needs: frontend-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Run Tests
    needs:
      - frontend-build
      - frontend-static
      - frontend-tests
      - backend-static
      - backend-tests
      - e2e
    if: ${{ always() && inputs.operation != 'diagnose-phr-orphan' && inputs.operation != 'recover-phr-orphan' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check required job results
        run: |
          check() {
            local name="$1" result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name => $result"
              exit 1
            fi
            echo "$name => $result"
          }
          check "frontend-build" "${{ needs.frontend-build.result }}"
          check "frontend-static" "${{ needs.frontend-static.result }}"
          check "frontend-tests" "${{ needs.frontend-tests.result }}"
          check "backend-static" "${{ needs.backend-static.result }}"
          check "backend-tests" "${{ needs.backend-tests.result }}"
          check "e2e" "${{ needs.e2e.result }}"

  deploy:
    name: Deploy to Production
    needs:
      - test
      - frontend-build
    # Deploys automatically on a green push to main. `workflow_dispatch` also still
    # works for a manual redeploy.
    #
    # This was manual-only while the repo was private and unreviewed: an authorization
    # review was outstanding and `required_reviewers` is not available on private repos
    # without a paid plan, so there was no way to gate an automatic deploy. Both
    # conditions have since cleared — the review is done and its findings are fixed,
    # and the repo is public.
    #
    # The gate that remains is `needs.test.result == 'success'`: the aggregate job checks
    # every other job explicitly, so a new job added to this workflow must also be added
    # to that check or it becomes invisible to the gate and can fail while the deploy
    # still runs.
    if: ${{ !cancelled() && vars.ATOMIC_DEPLOY_ENABLED != 'false' && inputs.operation != 'diagnose-phr-orphan' && inputs.operation != 'recover-phr-orphan' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs['frontend-build'].result == 'success' }}
    runs-on: ubuntu-24.04-arm
    environment: prod
    concurrency:
      # OHIF and the Laravel release both write through ~/phr-laravel. Serialize
      # their deploy jobs without cancelling either writer.
      group: phr-production-files
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer (no dev)
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Deploy with the shared cPanel action
        uses: bherila/shared-cpanel-deployment@e97463f105268c9f63449cf5b6730c95386f709d # v2.1.1
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-dir: phr-laravel
          site-url: https://phr.bherila.net
          atomic-layout: stable-directory
          initial-live-commit: ${{ vars.ATOMIC_INITIAL_LIVE_COMMIT }}
          recovery-release-id: ${{ vars.ATOMIC_RECOVERY_RELEASE_ID }}
          failure-policy: maintenance
          persistent-paths: |
            storage
            public/ohif
          excludes: |
            ohif
            phr-documents
            phr-exports
            phr-dicom
            s3-blobs
            /storage/app/private/oauth/
          passport-key-directory: storage/app/private/oauth
          artisan-memory-limit: 1G
          artisan-commands: phr:agent-api:verify-oauth-keys
          quiesce-script: .github/scripts/quiesce-phr-deployment.sh
          pre-migrate-script: .github/scripts/provision-phr-candidate-secrets.sh
          post-deploy-script: .github/scripts/verify-phr-candidate.sh
          post-activate-script: .github/scripts/verify-phr-activation.sh
          install-cron: true
          cron-memory-limit: 1G
          cron-lines: |
            */5 * * * * cd "$HOME/phr-laravel" && PHR_CRON_MEMORY_LIMIT=1G /opt/cpanel/ea-php85/root/usr/bin/php artisan phr:uptime:run-scheduler >> /dev/null 2>&1 # JOB:phr-laravel-scheduler
          extra-cron-lines: |
            */5 * * * * cd "$HOME/phr-laravel" && PHR_CRON_MEMORY_LIMIT=1G /usr/bin/flock -n "$HOME/phr-laravel/storage/framework/phr-queue-worker.lock" /opt/cpanel/ea-php85/root/usr/bin/php artisan phr:uptime:run-worker >> /dev/null 2>&1 # JOB:phr-laravel-queue-worker
          verification-script: .github/scripts/verify-phr-deployment.sh

  diagnose-orphan:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'diagnose-phr-orphan' && inputs.confirmation == 'DIAGNOSE_PHR_35100840905' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    environment: prod
    permissions:
      contents: read
    concurrency:
      group: phr-production-files
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Pin production host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read only fixed deployment inventory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          timeout 150 ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USERNAME@$SSH_HOST" \
            '/usr/bin/timeout --kill-after=10s 120 bash -s' \
            < .github/scripts/diagnose-phr-orphan.sh

  recover-orphan:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.ATOMIC_DEPLOY_ENABLED == 'false' && inputs.operation == 'recover-phr-orphan' && inputs.confirmation == 'RECOVER_PHR_35100840905' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    environment: prod
    permissions:
      contents: read
    concurrency:
      group: phr-production-files
      cancel-in-progress: false
    env:
      ORPHAN_RECOVERY_OWNER: orphan-c765e408-${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_RELEASE: legacy-20260916T131957Z-c765e4086fa2-35100840905-1
      EXPECTED_COMMIT: 153ddfdcb6e8180bf1d1291aa74202e13a92681e
      PRODUCTION_PHP: /opt/cpanel/ea-php85/root/usr/bin/php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Pin production host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Acquire canonical lock and preserve recovery evidence
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          remote_args=$(printf '%q ' prepare phr-laravel "$EXPECTED_RELEASE" "$EXPECTED_COMMIT" "$PRODUCTION_PHP" "$ORPHAN_RECOVERY_OWNER")
          timeout 330 ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USERNAME@$SSH_HOST" \
            "set -e; recovery_script=\$(mktemp); trap 'rm -f -- \"\$recovery_script\"' EXIT; cat >\"\$recovery_script\"; chmod 600 \"\$recovery_script\"; /usr/bin/timeout --kill-after=10s 300 bash \"\$recovery_script\" $remote_args" \
            < .github/scripts/recover-phr-orphan.sh
      - name: Supervise serving, verify public boundaries, restore recorded cron
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          run_remote() {
            timeout 390 ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USERNAME@$SSH_HOST" \
              "bash -s -- $(printf '%q ' "$1" phr-laravel "$EXPECTED_RELEASE" "$EXPECTED_COMMIT" "$PRODUCTION_PHP" "$ORPHAN_RECOVERY_OWNER")" \
              < .github/scripts/recover-phr-orphan.sh
          }
          run_remote start-supervisor
          run_remote wait-serving
          timeout 60 ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USERNAME@$SSH_HOST" \
            "bash -s -- $(printf '%q ' phr-laravel "$PRODUCTION_PHP" "$EXPECTED_RELEASE" "$EXPECTED_COMMIT" "$ORPHAN_RECOVERY_OWNER")" \
            < .github/scripts/verify-phr-ohif-artifact.sh
          bash .github/scripts/verify-phr-orphan-public.sh
          run_remote mark-verified
          run_remote wait-supervisor
          run_remote release-success
      - name: Restore original maintenance and keep owned cron paused on failure
        if: ${{ failure() || cancelled() }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          timeout 660 ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USERNAME@$SSH_HOST" \
            "bash -s -- $(printf '%q ' cleanup phr-laravel "$EXPECTED_RELEASE" "$EXPECTED_COMMIT" "$PRODUCTION_PHP" "$ORPHAN_RECOVERY_OWNER")" \
            < .github/scripts/recover-phr-orphan.sh
