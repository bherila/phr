name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A green push to main deploys automatically; this also permits manual redeploys.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A main run may already be quiescing production. Never cancel it between the
  # durable remote phases; pull-request runs can still supersede one another.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  # Keep the default `queue: single` to coalesce pending main CI runs rather
  # than deploy every intermediate push; the `phr-production-files` groups use
  # `max` for a different reason (see the deploy job). With ordinary
  # forward-moving pushes, a newer commit contains the earlier changes. This is
  # pending-run coalescing, not a commit-order or anti-rollback guarantee:
  # replacement is not an ancestry check, and an older run that is re-run keeps
  # its original SHA. See #126.

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Build frontend
        run: pnpm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: public/build/
          retention-days: 2

  frontend-static:
    name: Frontend Static Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      # This repository is public and the application handles clinical records, so a
      # committed identifier cannot be walked back: deleting it later leaves it in
      # history and in every fork. The scanner redacts its own output because CI logs
      # for a public repository are public too.
      - name: Scan for sensitive data
        run: pnpm run scan-sensitive

      - name: Audit Node dependencies
        run: pnpm audit --audit-level high --ignore-registry-errors

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Run Jest
        run: pnpm run test

  backend-static:
    name: Backend Static Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Test atomic deployment hooks
        run: |
          bash .github/scripts/quiesce-phr-deployment.test.sh
          bash .github/scripts/provision-phr-candidate-secrets.test.sh
          bash .github/scripts/verify-phr-candidate.test.sh
          bash .github/scripts/verify-phr-activation.test.sh
          bash .github/scripts/verify-phr-deployment.test.sh
          bash .github/scripts/verify-phr-finalized.test.sh
          bash .github/scripts/verify-frontend-manifest.test.sh
          bash .github/scripts/verify-phr-ohif-artifact.test.sh
          bash .github/scripts/converge-ohif-dist.test.sh
          bash .github/scripts/configure-ohif-ssh.test.sh
          bash .github/ohif/verify-dist.test.sh
          node --test .github/scripts/deployment-policy*.test.mjs
          bash .github/scripts/ohif-publication.test.sh
          bash .github/scripts/download-ohif-bundle.test.sh

      - name: Test agent mutation digest key installer
        run: bash .github/scripts/configure-agent-mutation-digest-key.test.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # upstream main: v0.9.1 + node24 runtime (#243), no tag yet
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Test Codex setup decisions
        run: bash codex/setup.test.sh

      - name: Validate synthetic C-CDA document
        run: pnpm run validate:ccda

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Run Pint
        run: ./vendor/bin/pint --test

      # phpstan.neon and the larastan dev dependency exist so this can gate; a
      # config that CI never runs is not a gate.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  backend-tests:
    name: Backend Tests
    # Some page tests render a real Blade view without ->withoutVite(), so they need
    # an actual public/build/manifest.json — reuse frontend-build's artifact instead
    # of building twice.
    needs: frontend-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # upstream main: v0.9.1 + node24 runtime (#243), no tag yet
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Create .env for tests
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run PHPUnit
        run: php -d memory_limit=1G vendor/bin/phpunit

  e2e:
    name: Playwright E2E
    needs: frontend-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # upstream main: v0.9.1 + node24 runtime (#243), no tag yet
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  ohif-transport-integration:
    name: OHIF Transport Integration
    # The real-transport half of the OHIF convergence tests: a real sshd on
    # loopback, real rsync on both ends, and the pinned deployment action's own
    # begin/preflight. The stub suite in backend-static cannot catch what a
    # real receiver does (it passed with `$HOME` in the destination, and does
    # not notice `--checksum` going missing), so this gates deploys too.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Read from the deploy step rather than repeated here, so bumping the
      # action cannot leave this suite testing the previous version.
      - name: Resolve the pinned deployment action
        id: action
        run: |
          shas=$(grep -oE 'bherila/shared-cpanel-deployment@[0-9a-f]{40}' .github/workflows/*.yml | sed 's/.*@//' | sort -u)
          if [ "$(printf '%s\n' "$shas" | grep -c .)" != 1 ]; then
            echo "::error::Expected exactly one pinned shared-cpanel-deployment SHA, found: $shas"
            exit 1
          fi
          echo "sha=$shas" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned deployment action
        uses: actions/checkout@v7
        with:
          repository: bherila/shared-cpanel-deployment
          ref: ${{ steps.action.outputs.sha }}
          path: .shared-cpanel-deployment
          persist-credentials: false

      # Only infrastructure setup is retried, within a fixed bound. The suite
      # itself is never retried: a behavioural failure is a real failure.
      - name: Install OpenSSH server
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            for attempt in 1 2 3; do
              if sudo apt-get update -q \
                && sudo apt-get install -y -q --no-install-recommends openssh-server; then
                break
              fi
              [ "$attempt" = 3 ] && exit 1
              sleep $((attempt * 10))
            done
          fi

      # Required mode fails, rather than skips, when sshd, the action checkout,
      # or the exact pinned revision is missing; only these three variables are
      # passed through sudo.
      - name: Run OHIF real-transport suite
        env:
          PHR_OHIF_INTEGRATION_REQUIRED: 'true'
          PHR_SHARED_ACTION_DIR: ${{ github.workspace }}/.shared-cpanel-deployment
          PHR_SHARED_ACTION_SHA: ${{ steps.action.outputs.sha }}
        run: sudo --preserve-env=PHR_OHIF_INTEGRATION_REQUIRED,PHR_SHARED_ACTION_DIR,PHR_SHARED_ACTION_SHA bash .github/scripts/converge-ohif-dist.integration.test.sh

      # Proves the suite can still see the defect it exists for: a disposable
      # copy of the script with `--checksum` removed must fail at a
      # STALE-CONTENT assertion, and an unmodified copy must not.
      - name: Check the suite still detects a dropped --checksum
        env:
          PHR_OHIF_INTEGRATION_REQUIRED: 'true'
          PHR_SHARED_ACTION_DIR: ${{ github.workspace }}/.shared-cpanel-deployment
          PHR_SHARED_ACTION_SHA: ${{ steps.action.outputs.sha }}
        run: |
          sudo --preserve-env=PHR_OHIF_INTEGRATION_REQUIRED,PHR_SHARED_ACTION_DIR,PHR_SHARED_ACTION_SHA bash .github/scripts/converge-ohif-dist.mutation-check.sh
          if sudo --preserve-env=PHR_OHIF_INTEGRATION_REQUIRED,PHR_SHARED_ACTION_DIR,PHR_SHARED_ACTION_SHA bash .github/scripts/converge-ohif-dist.mutation-check.sh --control; then
            echo '::error::The mutation check passed against an unmodified copy; it is not discriminating.'
            exit 1
          fi

  test:
    name: Run Tests
    needs:
      - frontend-build
      - frontend-static
      - frontend-tests
      - backend-static
      - backend-tests
      - e2e
      - ohif-transport-integration
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check required job results
        run: |
          check() {
            local name="$1" result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name => $result"
              exit 1
            fi
            echo "$name => $result"
          }
          check "frontend-build" "${{ needs.frontend-build.result }}"
          check "frontend-static" "${{ needs.frontend-static.result }}"
          check "frontend-tests" "${{ needs.frontend-tests.result }}"
          check "backend-static" "${{ needs.backend-static.result }}"
          check "backend-tests" "${{ needs.backend-tests.result }}"
          check "e2e" "${{ needs.e2e.result }}"
          check "ohif-transport-integration" "${{ needs.ohif-transport-integration.result }}"

  deploy:
    name: Deploy to Production
    needs:
      - test
      - frontend-build
    # Deploys automatically on a green push to main. `workflow_dispatch` also still
    # works for a manual redeploy.
    #
    # This was manual-only while the repo was private and unreviewed: an authorization
    # review was outstanding and `required_reviewers` is not available on private repos
    # without a paid plan, so there was no way to gate an automatic deploy. Both
    # conditions have since cleared — the review is done and its findings are fixed,
    # and the repo is public.
    #
    # The gate that remains is `needs.test.result == 'success'`: the aggregate job checks
    # every other job explicitly, so a new job added to this workflow must also be added
    # to that check or it becomes invisible to the gate and can fail while the deploy
    # still runs.
    if: ${{ !cancelled() && vars.ATOMIC_DEPLOY_ENABLED != 'false' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs['frontend-build'].result == 'success' }}
    runs-on: ubuntu-24.04-arm
    environment: prod
    concurrency:
      # Both production writers also take the same remote mutex. Queue order is
      # not source order; the policy gate refuses superseded app/artifact requests.
      group: phr-production-files
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      # Resolving and downloading the OHIF Dist bundle from its own run.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # upstream main: v0.9.1 + node24 runtime (#243), no tag yet
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer (no dev)
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Configure production SSH alias
        env:
          SSH_ALIAS: phr-ohif
          SSH_HOST_NAME: ${{ secrets.SSH_HOST }}
          SSH_USER_NAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash .github/scripts/configure-ohif-ssh.sh

      - name: Reject superseded application requests
        id: app-plan
        env:
          GH_TOKEN: ${{ github.token }}
          OHIF_SSH_TARGET: phr-ohif
        run: node .github/scripts/deployment-policy.mjs app

      - name: Preflight the frontend build manifest
        if: ${{ steps.app-plan.outputs.proceed == 'true' }}
        env:
          PHR_MANIFEST_PATH: public/build/manifest.json
          PHR_MANIFEST_BUILD_ROOT: public/build
        run: bash .github/scripts/verify-frontend-manifest.sh

      - name: Resolve the newest built OHIF bundle
        if: ${{ steps.app-plan.outputs.proceed == 'true' }}
        id: ohif
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/deployment-policy.mjs ohif

      - name: Download the exact desired OHIF artifact
        if: ${{ steps.app-plan.outputs.proceed == 'true' && steps.ohif.outputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OHIF_ARTIFACT_ID: ${{ steps.ohif.outputs.artifact_id }}
          OHIF_ARTIFACT_DIGEST: ${{ steps.ohif.outputs.artifact_digest }}
          OHIF_BUNDLE_DIR: ohif-desired
        run: bash .github/scripts/download-ohif-bundle.sh

      # Only first installation needs a managed OHIF directory before begin.
      # Ordinary application publication happens inside live verification while
      # the shared action owns the remote lock, keeping recovery reachable.
      - name: Stage OHIF for first installation
        if: ${{ steps.app-plan.outputs.bootstrap == 'true' && steps.ohif.outputs.run_id != '' }}
        env:
          OHIF_SSH_TARGET: phr-ohif
          OHIF_BUNDLE_DIR: ohif-desired
          OHIF_RUN_ID: ${{ steps.ohif.outputs.run_id }}
          OHIF_ARTIFACT_ID: ${{ steps.ohif.outputs.artifact_id }}
          OHIF_ARTIFACT_DIGEST: ${{ steps.ohif.outputs.artifact_digest }}
          OHIF_SOURCE_COMMIT: ${{ steps.ohif.outputs.source_commit }}
        run: bash .github/scripts/publish-ohif-dist.sh

      - name: Deploy with the shared cPanel action
        if: ${{ steps.app-plan.outputs.proceed == 'true' }}
        uses: bherila/shared-cpanel-deployment@f1bd4c18b63365f1463e068c52c66e46c17213dd # canonical runtime audit and final-review fixes (#35, #40)
        env:
          OHIF_SSH_TARGET: phr-ohif
          OHIF_BUNDLE_DIR: ohif-desired
          OHIF_RUN_ID: ${{ steps.ohif.outputs.run_id }}
          OHIF_ARTIFACT_ID: ${{ steps.ohif.outputs.artifact_id }}
          OHIF_ARTIFACT_DIGEST: ${{ steps.ohif.outputs.artifact_digest }}
          OHIF_SOURCE_COMMIT: ${{ steps.ohif.outputs.source_commit }}
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-dir: phr-laravel
          site-url: https://phr.bherila.net
          atomic-layout: stable-directory
          initial-live-commit: ${{ vars.ATOMIC_INITIAL_LIVE_COMMIT }}
          recovery-release-id: ${{ vars.ATOMIC_RECOVERY_RELEASE_ID }}
          failure-policy: maintenance
          operational-audit: true
          runtime-audit: true
          post-finalize-script: .github/scripts/verify-phr-finalized.sh
          # The pre-migrate hook runs the digest-key installer from the candidate.
          # Keep the shared action's standard application paths plus that helper.
          paths: |
            app
            bootstrap
            config
            database
            public
            resources
            routes
            scripts
            storage
            vendor
            artisan
            composer.json
            composer.lock
          persistent-paths: |
            storage
            public/ohif
          excludes: |
            ohif
            phr-documents
            phr-exports
            phr-dicom
            s3-blobs
            /storage/app/private/oauth/
          passport-key-directory: storage/app/private/oauth
          artisan-memory-limit: 1G
          artisan-commands: phr:agent-api:verify-oauth-keys
          quiesce-script: .github/scripts/quiesce-phr-deployment.sh
          pre-migrate-script: .github/scripts/provision-phr-candidate-secrets.sh
          post-deploy-script: .github/scripts/verify-phr-candidate.sh
          post-activate-script: .github/scripts/verify-phr-activation.sh
          install-cron: true
          cron-memory-limit: 1G
          cron-lines: |
            */5 * * * * cd "$HOME/phr-laravel" && PHR_CRON_MEMORY_LIMIT=1G /opt/cpanel/ea-php85/root/usr/bin/php artisan phr:uptime:run-scheduler >> /dev/null 2>&1 # JOB:phr-laravel-scheduler
          extra-cron-lines: |
            */5 * * * * cd "$HOME/phr-laravel" && PHR_CRON_MEMORY_LIMIT=1G /usr/bin/flock -n "$HOME/phr-laravel/storage/framework/phr-queue-worker.lock" /opt/cpanel/ea-php85/root/usr/bin/php artisan phr:uptime:run-worker >> /dev/null 2>&1 # JOB:phr-laravel-queue-worker
          verification-script: .github/scripts/verify-phr-deployment.sh
