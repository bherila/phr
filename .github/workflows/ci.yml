name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A green push to main deploys automatically; this also permits manual redeploys.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Build frontend
        run: pnpm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: public/build/
          retention-days: 2

  frontend-static:
    name: Frontend Static Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      # This repository is public and the application handles clinical records, so a
      # committed identifier cannot be walked back: deleting it later leaves it in
      # history and in every fork. The scanner redacts its own output because CI logs
      # for a public repository are public too.
      - name: Scan for sensitive data
        run: pnpm run scan-sensitive

      - name: Audit Node dependencies
        run: pnpm audit --audit-level high --ignore-registry-errors

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Run Jest
        run: pnpm run test

  backend-static:
    name: Backend Static Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Test cPanel cron installer
        run: bash .github/scripts/configure-phr-scheduler.test.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate synthetic C-CDA document
        run: pnpm run validate:ccda

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Run Pint
        run: ./vendor/bin/pint --test

      # phpstan.neon and the larastan dev dependency exist so this can gate; a
      # config that CI never runs is not a gate.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  backend-tests:
    name: Backend Tests
    # Some page tests render a real Blade view without ->withoutVite(), so they need
    # an actual public/build/manifest.json — reuse frontend-build's artifact instead
    # of building twice.
    needs: frontend-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Download frontend build artifact
        uses: actions/download-artifact@v5
        with:
          name: frontend-build
          path: public/build/

      - name: Create .env for tests
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run PHPUnit
        run: php -d memory_limit=1G vendor/bin/phpunit

  e2e:
    name: Playwright E2E
    needs: frontend-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Download frontend build artifact
        uses: actions/download-artifact@v5
        with:
          name: frontend-build
          path: public/build/

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Run Tests
    needs:
      - frontend-build
      - frontend-static
      - frontend-tests
      - backend-static
      - backend-tests
      - e2e
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check required job results
        run: |
          check() {
            local name="$1" result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name => $result"
              exit 1
            fi
            echo "$name => $result"
          }
          check "frontend-build" "${{ needs.frontend-build.result }}"
          check "frontend-static" "${{ needs.frontend-static.result }}"
          check "frontend-tests" "${{ needs.frontend-tests.result }}"
          check "backend-static" "${{ needs.backend-static.result }}"
          check "backend-tests" "${{ needs.backend-tests.result }}"
          check "e2e" "${{ needs.e2e.result }}"

  deploy:
    name: Deploy to Production
    needs:
      - test
      - frontend-build
    # Deploys automatically on a green push to main, matching bherila/2025-website and
    # bherila/website-games. `workflow_dispatch` also still works for a manual redeploy.
    #
    # This was manual-only while the repo was private and unreviewed: the authorization
    # review (bherila/2025-website#1805) was outstanding and `required_reviewers` is not
    # available on private repos without a paid plan, so there was no way to gate an
    # automatic deploy. Both conditions have since cleared — the review is done and its
    # findings are fixed, and the repo is public.
    #
    # The gate that remains is `needs.test.result == 'success'`: the aggregate job checks
    # every other job explicitly, so a new job added to this workflow must also be added
    # to that check or it becomes invisible to the gate and can fail while the deploy
    # still runs.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs['frontend-build'].result == 'success' }}
    runs-on: ubuntu-24.04-arm
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer (no dev)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Download frontend build artifact
        uses: actions/download-artifact@v5
        with:
          name: frontend-build
          path: public/build/

      # cPanel stores the vhost's PHP-version handler INSIDE public/.htaccess, which rsync
      # replaces on every deploy. Without re-appending it the vhost silently falls back to
      # the account default (ea-php81) and every page 500s on composer's platform check —
      # while this workflow still reports success, because every step exits 0. The failure
      # is visible only in ~/phr-laravel/public/error_log. Setting the version in MultiPHP
      # is not enough on its own: the next deploy wipes it again.
      - name: Append cPanel PHP handler to .htaccess
        run: cat htaccess-append.txt >> public/.htaccess

      - name: Set up SSH deploy key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Destination is hard-coded to ~/phr-laravel/ — this account also hosts the
      # separate finance app at ~/bwh-php/ (webroot ~/public_html) and the games app at
      # ~/games-laravel/, and --delete makes a wrong or empty destination catastrophic.
      # Never point this at ~/, ~/bwh-php, ~/games-laravel, or ~/public_html.
      #
      # Host key is pinned via SSH_KNOWN_HOSTS (no StrictHostKeyChecking=no) — the
      # deploy key alone only proves who we are, not that the server is who it claims
      # to be, so skipping host verification here would defeat the point of pinning it.
      #
      # The --exclude list is what --delete must not touch. Excluded paths are
      # hidden from the transfer entirely, so rsync also refuses to delete them
      # on the receiver:
      #   ohif           the ~200 MB static OHIF Viewer bundle at public/ohif/.
      #                  It is built out of band and is not in git, so without
      #                  this the first deploy after uploading it deletes it and
      #                  /ohif/viewer/... starts 404ing again.
      #   phr-documents  local disk root for uploaded PHR documents.
      #   phr-exports    local disk root for generated PHR exports.
      #   phr-dicom      local disk root for DICOM pixel data (storage/app/private/).
      #   s3-blobs       local disk root for GenAI import staging (the disk named "s3").
      #   oauth          persistent Passport signing keys. Rotating these on deploy
      #                  immediately invalidates every connected OAuth client.
      # These hold real clinical records that only exist on the server; deleting them is
      # unrecoverable. phr-dicom joined that list on 2026-08-01 when DICOM moved off
      # Cloudflare R2 onto this host — before that the data lived in a bucket and this
      # exclude was unnecessary. It is now load-bearing for ~824 MB of patient imaging
      # that exists nowhere else on the server.
      #
      # LocalDiskDeployExcludeTest asserts this list covers every local disk root, so
      # adding a disk without an exclude fails the build rather than the next deploy.
      - name: Deploy with rsync
        run: |
          rsync -av --delete \
            --exclude='.env' \
            --exclude='ohif' \
            --exclude='phr-documents' \
            --exclude='phr-exports' \
            --exclude='phr-dicom' \
            --exclude='s3-blobs' \
            --exclude='/storage/app/private/oauth/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            app \
            bootstrap \
            config \
            database \
            public \
            resources \
            routes \
            storage \
            vendor \
            artisan \
            composer.json \
            composer.lock \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/phr-laravel/

      - name: Create or verify persistent OAuth signing keys
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "cd ~/phr-laravel && \
             install -d -m 700 storage/app/private/oauth && \
             if [ -s storage/app/private/oauth/oauth-private.key ] && [ -s storage/app/private/oauth/oauth-public.key ]; then \
               chmod 600 storage/app/private/oauth/oauth-private.key storage/app/private/oauth/oauth-public.key; \
             elif [ ! -e storage/app/private/oauth/oauth-private.key ] && [ ! -e storage/app/private/oauth/oauth-public.key ]; then \
               /opt/cpanel/ea-php85/root/usr/bin/php artisan passport:keys --force && \
               chmod 600 storage/app/private/oauth/oauth-private.key storage/app/private/oauth/oauth-public.key; \
             else \
               echo 'OAuth signing key pair is incomplete; refusing to rotate it automatically.' >&2; \
               exit 1; \
             fi && \
             /opt/cpanel/ea-php85/root/usr/bin/php artisan phr:agent-api:verify-oauth-keys"

      - name: Run artisan migrate, config clear/cache on server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "cd ~/phr-laravel && /opt/cpanel/ea-php85/root/usr/bin/php artisan migrate --force && /opt/cpanel/ea-php85/root/usr/bin/php artisan config:clear && /opt/cpanel/ea-php85/root/usr/bin/php artisan config:cache"

      - name: Configure and verify cPanel scheduler and queue worker crons
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "bash -s" < .github/scripts/configure-phr-scheduler.sh

      - name: Verify production health
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 https://phr.bherila.net/up > /dev/null
