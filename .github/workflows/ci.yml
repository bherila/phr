name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A green push to main deploys automatically; this also permits manual redeploys.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A main run may already be quiescing production. Never cancel it between the
  # durable remote phases; pull-request runs can still supersede one another.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Build frontend
        run: pnpm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: public/build/
          retention-days: 2

  frontend-static:
    name: Frontend Static Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      # This repository is public and the application handles clinical records, so a
      # committed identifier cannot be walked back: deleting it later leaves it in
      # history and in every fork. The scanner redacts its own output because CI logs
      # for a public repository are public too.
      - name: Scan for sensitive data
        run: pnpm run scan-sensitive

      - name: Audit Node dependencies
        run: pnpm audit --audit-level high --ignore-registry-errors

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Run Jest
        run: pnpm run test

  backend-static:
    name: Backend Static Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Test atomic deployment hooks
        run: |
          bash .github/scripts/quiesce-phr-deployment.test.sh
          bash .github/scripts/provision-phr-candidate-secrets.test.sh
          bash .github/scripts/verify-phr-candidate.test.sh
          bash .github/scripts/verify-phr-activation.test.sh
          bash .github/scripts/verify-phr-deployment.test.sh

      - name: Test agent mutation digest key installer
        run: bash .github/scripts/configure-agent-mutation-digest-key.test.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Validate synthetic C-CDA document
        run: pnpm run validate:ccda

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Run Pint
        run: ./vendor/bin/pint --test

      # phpstan.neon and the larastan dev dependency exist so this can gate; a
      # config that CI never runs is not a gate.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  backend-tests:
    name: Backend Tests
    # Some page tests render a real Blade view without ->withoutVite(), so they need
    # an actual public/build/manifest.json — reuse frontend-build's artifact instead
    # of building twice.
    needs: frontend-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Create .env for tests
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run PHPUnit
        run: php -d memory_limit=1G vendor/bin/phpunit

  e2e:
    name: Playwright E2E
    needs: frontend-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction

      - name: Setup pnpm + Node dependencies
        uses: ./.github/actions/setup-pnpm-node

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Run Tests
    needs:
      - frontend-build
      - frontend-static
      - frontend-tests
      - backend-static
      - backend-tests
      - e2e
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check required job results
        run: |
          check() {
            local name="$1" result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name => $result"
              exit 1
            fi
            echo "$name => $result"
          }
          check "frontend-build" "${{ needs.frontend-build.result }}"
          check "frontend-static" "${{ needs.frontend-static.result }}"
          check "frontend-tests" "${{ needs.frontend-tests.result }}"
          check "backend-static" "${{ needs.backend-static.result }}"
          check "backend-tests" "${{ needs.backend-tests.result }}"
          check "e2e" "${{ needs.e2e.result }}"

  deploy:
    name: Deploy to Production
    needs:
      - test
      - frontend-build
    # Deploys automatically on a green push to main. `workflow_dispatch` also still
    # works for a manual redeploy.
    #
    # This was manual-only while the repo was private and unreviewed: an authorization
    # review was outstanding and `required_reviewers` is not available on private repos
    # without a paid plan, so there was no way to gate an automatic deploy. Both
    # conditions have since cleared — the review is done and its findings are fixed,
    # and the repo is public.
    #
    # The gate that remains is `needs.test.result == 'success'`: the aggregate job checks
    # every other job explicitly, so a new job added to this workflow must also be added
    # to that check or it becomes invisible to the gate and can fail while the deploy
    # still runs.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs['frontend-build'].result == 'success' }}
    runs-on: ubuntu-24.04-arm
    environment: prod
    concurrency:
      # OHIF and the Laravel release both write through ~/phr-laravel. Serialize
      # their deploy jobs without cancelling either writer.
      group: phr-production-files
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer (no dev)
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build/

      - name: Deploy with the shared cPanel action
        uses: bherila/shared-cpanel-deployment@5ee5d2a006eb4c21d827069e4c9428e764907c16 # v2.1.0
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-dir: phr-laravel
          site-url: https://phr.bherila.net
          atomic-layout: stable-directory
          initial-live-commit: ${{ vars.ATOMIC_INITIAL_LIVE_COMMIT }}
          recovery-release-id: ${{ vars.ATOMIC_RECOVERY_RELEASE_ID }}
          failure-policy: maintenance
          persistent-paths: |
            storage
            public/ohif
          excludes: |
            ohif
            phr-documents
            phr-exports
            phr-dicom
            s3-blobs
            /storage/app/private/oauth/
          passport-key-directory: storage/app/private/oauth
          artisan-memory-limit: 1G
          artisan-commands: phr:agent-api:verify-oauth-keys
          quiesce-script: .github/scripts/quiesce-phr-deployment.sh
          pre-migrate-script: .github/scripts/provision-phr-candidate-secrets.sh
          post-deploy-script: .github/scripts/verify-phr-candidate.sh
          post-activate-script: .github/scripts/verify-phr-activation.sh
          install-cron: true
          cron-memory-limit: 1G
          cron-lines: |
            */5 * * * * cd "$HOME/phr-laravel" && PHR_CRON_MEMORY_LIMIT=1G /opt/cpanel/ea-php85/root/usr/bin/php artisan phr:uptime:run-scheduler >> /dev/null 2>&1 # JOB:phr-laravel-scheduler
          extra-cron-lines: |
            */5 * * * * cd "$HOME/phr-laravel" && PHR_CRON_MEMORY_LIMIT=1G /usr/bin/flock -n "$HOME/phr-laravel/storage/framework/phr-queue-worker.lock" /opt/cpanel/ea-php85/root/usr/bin/php artisan phr:uptime:run-worker >> /dev/null 2>&1 # JOB:phr-laravel-queue-worker
          verification-script: .github/scripts/verify-phr-deployment.sh
